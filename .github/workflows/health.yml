name: Health
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          mkdir -p output
          printf '## PR Health\n\nFORK-PR-ARTIFACT-ONLY-POC nonce=FORKPR-2026-11-05\n\n[@dart-lang/sdk-team](https://example.invalid/phish)\n' > output/comment.md
          echo "${{ github.event.pull_request.number }}" > output/issueNumber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: output
          path: output/
